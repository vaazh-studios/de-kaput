<svg xmlns="http://www.w3.org/2000/svg" width="980" height="215" viewBox="0 0 980 215" role="img" aria-labelledby="title desc">
  <title id="title">How de-kaput works</title>
  <desc id="desc">Top crashes go to dekaput list, which picks the next crash, or leaves a note when no test can reach it. The agent writes a test that crashes the same way. dekaput verify checks it: when the test fails on main, the agent fixes the code and verifies again; a rejected test goes back to be rewritten. A proven result, or one already fixed on main, goes to dekaput open-pr, which opens a pull request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { font-size: 15px; fill: #24292f; text-anchor: middle; dominant-baseline: middle; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #24292f; text-anchor: middle; dominant-baseline: middle; }
    .label { font-size: 12px; fill: #768390; text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .line { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .dashed { stroke-dasharray: 5 4; }
  </style>

  <!-- main row -->
  <rect x="8" y="60" width="104" height="44" rx="22" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
  <text class="box" x="60" y="82">Top crashes</text>

  <rect x="136" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text class="cmd" x="206" y="82">dekaput list</text>
  <text class="label" x="206" y="50">finds the crash's commit</text>

  <rect x="300" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text class="box" x="370" y="82">Test that crashes</text>
  <text class="label" x="370" y="122">in a new worktree</text>

  <rect x="464" y="60" width="140" height="44" rx="8" fill="#f3edff" stroke="#8250df" stroke-width="2.4"/>
  <text class="cmd" x="534" y="82">dekaput verify</text>

  <rect x="704" y="60" width="140" height="44" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text class="cmd" x="774" y="82">dekaput open-pr</text>

  <rect x="868" y="60" width="104" height="44" rx="22" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text class="box" x="920" y="82">Pull request</text>

  <!-- main arrows -->
  <line class="line" x1="112" y1="82" x2="134" y2="82" marker-end="url(#arrow)"/>
  <line class="line" x1="276" y1="82" x2="298" y2="82" marker-end="url(#arrow)"/>
  <line class="line" x1="440" y1="82" x2="462" y2="82" marker-end="url(#arrow)"/>
  <line class="line" x1="604" y1="82" x2="702" y2="82" marker-end="url(#arrow)"/>
  <text class="label" x="654" y="72">proven</text>
  <text class="label" x="654" y="102">or already</text>
  <text class="label" x="654" y="117">fixed on main</text>
  <line class="line" x1="844" y1="82" x2="866" y2="82" marker-end="url(#arrow)"/>

  <!-- rejected: back to the test -->
  <path class="line dashed" d="M 520 60 C 505 22, 400 22, 386 58" marker-end="url(#arrow)"/>
  <text class="label" x="453" y="24">rejected</text>

  <!-- no test can reach it: a note -->
  <line class="line dashed" x1="206" y1="104" x2="206" y2="158" marker-end="url(#arrow)"/>
  <text class="label start" x="212" y="135">can't test</text>
  <rect x="156" y="160" width="100" height="40" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="box" x="206" y="180">Note</text>

  <!-- fails on main: fix, then verify again -->
  <line class="line" x1="514" y1="104" x2="514" y2="158" marker-end="url(#arrow)"/>
  <text class="label end" x="508" y="135">fails on main</text>
  <rect x="479" y="160" width="110" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/>
  <text class="box" x="534" y="180">Fix</text>
  <line class="line" x1="554" y1="160" x2="554" y2="106" marker-end="url(#arrow)"/>
</svg>
